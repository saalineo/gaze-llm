[package]
name = "gazellm"
version = "0.1.0"
edition = "2021"
description = "High-Performance LLM Serving Engine"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
tonic = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
